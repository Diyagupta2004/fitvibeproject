<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitVibe: Yoga Hold Challenge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-purple: #8B5CF6; /* A modern, rich purple */
            --accent-pink: #EC4899;    /* A vibrant pink for accents */
            --dark-bg: #111827;       /* Very dark navy-blue */
            --card-bg: #1F2937;       /* Lighter navy-blue */
            --text-light: #F9FAFB;
            --text-muted: #9CA3AF;
            --red-warning: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            background: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .game-container {
            width: 95%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid #374151;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease-in-out;
        }
        
        /* General hidden class for smooth transitions */
        .hidden {
            display: none !important;
        }
        
        /* Fade transition classes */
        .fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .fade-in {
            opacity: 1;
            transform: scale(1);
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-section {
            display: flex;
            justify-content: space-between;
            padding: 0 1rem;
            font-size: 1rem;
            font-weight: 600;
        }

        .info-section p {
            color: var(--text-muted);
        }

        .info-section span {
            color: var(--text-light);
            font-weight: 700;
        }
        
        #pose-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s ease-in-out;
        }

        #pose-image {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        
        #pose-name {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-light);
        }

        #pose-quote {
            font-style: italic;
            font-size: 0.9rem;
            color: var(--text-muted);
            max-width: 80%;
        }

        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        #timer {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--primary-purple);
            line-height: 1;
        }
        
        #progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #374151;
            border-radius: 4px;
            overflow: hidden;
        }
        
        #progress-bar {
            width: 100%;
            height: 100%;
            background-color: var(--primary-purple);
            border-radius: 4px;
            transition: width 0.5s linear, background-color 0.3s ease;
        }
        #progress-bar.warning {
            background-color: var(--red-warning);
        }

        #message {
            min-height: 24px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--accent-pink);
        }

        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
            transition: all 0.3s ease-in-out;
        }
        
        #start-screen h2 {
            font-size: 1.8rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .difficulty-options {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        .difficulty-options button {
            background-color: transparent;
            color: var(--primary-purple);
            border: 2px solid var(--primary-purple);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .difficulty-options button:hover {
             background-color: var(--primary-purple);
            color: var(--dark-bg);
            transform: translateY(-2px);
        }

        .difficulty-options button.active {
            background-color: var(--primary-purple);
            color: var(--dark-bg);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn {
            background-color: var(--primary-purple);
            color: var(--dark-bg);
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover:not(:disabled) {
            background-color: #7C3AED; /* Darker purple */
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }
        
        .btn:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn:disabled {
            background-color: #374151;
            color: #6B7280;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        #countdown-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(31, 41, 55, 0.9);
            color: var(--text-light);
            font-size: 8rem;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            border-radius: 20px;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>FitVibe Yoga Hold</h1>
        </header>

        <div class="info-section">
            <p>Score: <span id="score">0</span></p>
            <p>High Score: <span id="high-score">0</span></p>
        </div>

        <main id="game-area">
             <div id="start-screen">
                <h2>Yoga Challenge</h2>
                <p>Select your difficulty level to begin.</p>
                <div class="difficulty-options">
                    <button data-difficulty="easy">Easy</button>
                    <button data-difficulty="medium">Medium</button>
                    <button data-difficulty="hard">Hard</button>
                </div>
                <button id="startGameButton" class="btn hidden">Start Challenge</button>
            </div>

            <div id="pose-display" class="hidden fade-out">
                <h2 id="pose-name"></h2>
                <img id="pose-image" src="" alt="Yoga Pose" />
                <p id="pose-quote"></p>
            </div>
        </main>

        <div class="timer-section">
            <div id="timer"></div>
            <div id="progress-bar-container" class="hidden">
                 <div id="progress-bar"></div>
            </div>
            <p id="message"></p>
        </div>

        <div class="button-group">
            <button id="nextPoseButton" class="btn hidden">Next Pose</button>
        </div>

        <div id="countdown-overlay"></div>
    </div>

    <audio id="countdownSound" src="https://www.soundjay.com/button/beep-07a.mp3" preload="auto"></audio>
    <audio id="goSound" src="https://www.soundjay.com/button/button-10.mp3" preload="auto"></audio>
    <audio id="successSound" src="https://www.soundjay.com/button/button-20.mp3" preload="auto"></audio>

    <script>
        const poses = [
            {
                name: "Tree Pose",
                image: "tree.jpg.jpeg",
                quote: "Stand tall, root deep, and balance like a tree.",
                duration: { easy: 20, medium: 30, hard: 45 }
            },
            {
                name: "Warrior II",
                image: "warrior.jpg.jpeg",
                quote: "Channel your inner strength and stand your ground.",
                duration: { easy: 25, medium: 35, hard: 50 }
            },
            {
                name: "Cobra Pose",
                image: "cobra.jpg.jpeg",
                quote: "Rise up, open your heart, and breathe with strength.",
                duration: { easy: 15, medium: 25, hard: 40 }
            },
            {
                name: "Downward Dog",
                image: "downwarddog.jpg.jpeg",
                quote: "Feel the stretch and let go of all tension.",
                duration: { easy: 30, medium: 45, hard: 60 }
            },
            {
                name: "Child’s Pose",
                image: "childpose.jpg.jpeg",
                quote: "Rest, reset, and restore your energy.",
                duration: { easy: 10, medium: 20, hard: 30 }
            }
        ];

        // DOM Elements
        const timerDisplay = document.getElementById("timer");
        const poseNameDisplay = document.getElementById("pose-name");
        const poseImage = document.getElementById("pose-image");
        const poseQuoteDisplay = document.getElementById("pose-quote");
        const messageDisplay = document.getElementById("message");
        const scoreDisplay = document.getElementById("score");
        const highScoreDisplay = document.getElementById("high-score");
        
        const startScreen = document.getElementById("start-screen");
        const poseDisplay = document.getElementById("pose-display");
        const difficultyButtons = document.querySelectorAll('.difficulty-options button');
        const startGameButton = document.getElementById('startGameButton');
        const nextPoseButton = document.getElementById('nextPoseButton');
        
        const progressBar = document.getElementById('progress-bar');
        const progressBarContainer = document.getElementById('progress-bar-container');
        const countdownOverlay = document.getElementById('countdown-overlay');

        // Sounds
        const countdownSound = document.getElementById("countdownSound");
        const goSound = document.getElementById("goSound");
        const successSound = document.getElementById("successSound");

        // Game State
        let timerInterval;
        let score = 0;
        let highScore = localStorage.getItem('yogaHighScore') || 0;
        let currentDifficulty = null;
        let currentPose;

        function initialize() {
            highScoreDisplay.textContent = highScore;
            messageDisplay.textContent = 'Select a difficulty to begin.';
        }

        function playSound(sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.error("Sound play failed:", e));
        }

        function updatePoseUI() {
            poseNameDisplay.innerText = currentPose.name;
            poseImage.src = currentPose.image;
            poseImage.alt = currentPose.name;
            poseQuoteDisplay.innerText = currentPose.quote;
        }

        function startRound() {
            currentPose = poses[Math.floor(Math.random() * poses.length)];
            const duration = currentPose.duration[currentDifficulty];
            let timeLeft = duration;
            
            updatePoseUI();
            
            messageDisplay.textContent = "Hold the pose! 🧘‍♀️";
            timerDisplay.textContent = timeLeft;
            progressBar.style.width = '100%';
            progressBar.classList.remove('warning');
            progressBarContainer.classList.remove('hidden');
            nextPoseButton.classList.add('hidden');

            timerInterval = setInterval(() => {
                timeLeft--;
                const progressPercentage = (timeLeft / duration) * 100;
                progressBar.style.width = `${progressPercentage}%`;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 5 && timeLeft > 0) {
                    progressBar.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    playSound(successSound);
                    messageDisplay.textContent = "🎉 Great job! You held the pose!";
                    score++;
                    scoreDisplay.textContent = score;

                    if (score > highScore) {
                        highScore = score;
                        highScoreDisplay.textContent = highScore;
                        localStorage.setItem('yogaHighScore', highScore);
                    }
                    
                    nextPoseButton.classList.remove('hidden');
                    progressBarContainer.classList.add('hidden');
                    timerDisplay.textContent = '';
                }
            }, 1000);
        }

        function startCountdown() {
            countdownOverlay.classList.remove('hidden');
            let count = 3;

            function updateCountdown() {
                if (count > 0) {
                    countdownOverlay.style.opacity = '1';
                    countdownOverlay.textContent = count;
                    playSound(countdownSound);
                    count--;
                    setTimeout(() => {
                       countdownOverlay.style.opacity = '0';
                       setTimeout(updateCountdown, 400); // Wait for fade out
                    }, 600); // Time digit is visible
                } else {
                    countdownOverlay.style.opacity = '1';
                    countdownOverlay.textContent = "HOLD!";
                    playSound(goSound);
                    setTimeout(() => {
                        countdownOverlay.style.opacity = '0';
                        setTimeout(() => countdownOverlay.classList.add('hidden'), 300);
                        startRound();
                    }, 800);
                }
            }
            updateCountdown();
        }

        difficultyButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                difficultyButtons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentDifficulty = e.target.dataset.difficulty;
                startGameButton.classList.remove('hidden');
                messageDisplay.textContent = `Ready for a ${currentDifficulty} challenge?`;
            });
        });

        startGameButton.addEventListener('click', () => {
            startScreen.classList.add('fade-out');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                poseDisplay.classList.remove('hidden');
                poseDisplay.classList.remove('fade-out');
            }, 300);
            startCountdown();
        });

        nextPoseButton.addEventListener('click', startCountdown);

        window.onload = initialize;
    </script>
</body>
</html>
