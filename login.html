<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FitVibe</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #121212;
      color: #e6e6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: #1f1f1f;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(177, 156, 217, 0.15);
      width: 100%;
      max-width: 400px;
    }

    .login-container h2 {
      color: #b19cd9;
      font-size: 2rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .login-container p {
      color: #aaa;
      margin-bottom: 25px;
      font-size: 0.95rem;
      text-align: center;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #2c2c2c;
      color: #e6e6fa;
      transition: border 0.3s ease;
      font-size: 1rem;
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: #b19cd9;
      box-shadow: 0 0 5px rgba(177, 156, 217, 0.5);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
      color: #aaa;
      font-size: 1rem;
    }

    .remember-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .remember-container input[type="checkbox"] {
      margin: 0;
      width: 16px;
      height: 16px;
      accent-color: #b19cd9;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, #b19cd9, #a188c8);
      color: #121212;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #a188c8, #b19cd9);
    }

    .or-container {
      margin: 25px 0 15px;
      display: flex;
      align-items: center;
      text-align: center;
      color: #666;
      font-size: 0.85rem;
    }

    .or-container::before,
    .or-container::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #333;
    }

    .or-container span {
      margin: 0 10px;
    }

    .google-btn button {
      background-color: #333;
      color: #e6e6fa;
      border: 1px solid #555;
      margin-top: 10px;
    }

    .google-btn button:hover {
      background-color: #444;
    }

    .signup-link {
      margin-top: 20px;
      font-size: 0.9rem;
      text-align: center;
    }

    .signup-link a {
      color: #b19cd9;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .forgot-password {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .forgot-password a {
      color: #b19cd9;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #a188c8;
      color: #121212;
      padding: 14px 24px;
      border-radius: 8px;
      opacity: 0;
      transform: translateX(100%);
      transition: all 0.5s ease;
      z-index: 1000;
    }

    .notification.show {
      opacity: 1;
      transform: translateX(0);
    }

    .google-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #1f1f1f;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(177, 156, 217, 0.3);
      display: none;
      z-index: 2000;
    }

    .google-popup h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #b19cd9;
    }

    .google-option {
      padding: 10px 15px;
      margin-bottom: 10px;
      background-color: #2c2c2c;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
      color: #e6e6fa;
    }

    .google-option:hover {
      background-color: #3a3a3a;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h2>FitVibe</h2>

    <form id="loginForm">
      <div class="input-wrapper">
        <input type="email" id="email" placeholder="Email" required>
      </div>

      <div class="input-wrapper">
        <input type="password" id="password" placeholder="Password" required>
        <i class="fa-solid fa-eye toggle-password" id="togglePassword" aria-hidden="true"></i>
      </div>

      <div class="remember-container">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me</label>
      </div>

      <button type="submit">Login</button>
    </form>

    <div class="forgot-password">
      <a href="forget.html">Forgot Password?</a>
    </div>

    <div class="or-container">
      <span>OR</span>
    </div>

    <div class="google-btn">
      <button onclick="showGooglePopup()">Login with Google</button>
    </div>

    <div class="signup-link">
      Don't have an account? <a href="sign.html">Sign up</a>
    </div>
  </div>

  <div class="notification" id="notification">Logged in successfully!</div>

  <div class="google-popup" id="googlePopup">
    <h3>Select a Google account</h3>
    <div class="google-option" onclick="loginAs('diya@gmail.com')">diya@gmail.com</div>
    <div class="google-option" onclick="loginAs('ghanisha@gmail.com')">ghanisha@gmail.com</div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const notification = document.getElementById("notification");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const googlePopup = document.getElementById("googlePopup");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;

      // Fetch users from localStorage
      const users = JSON.parse(localStorage.getItem("fitvibe_users")) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        localStorage.setItem("isLoggedIn", "true");
        showNotification("Logged in successfully!");
        setTimeout(() => {
          window.location.href = "FitVibe.html";
        }, 1500);
      } else {
        showNotification("Invalid email or password.");
      }
    });

    function showNotification(message) {
      notification.textContent = message;
      notification.classList.add("show");
      setTimeout(() => {
        notification.classList.remove("show");
      }, 3000);
    }

    function showGooglePopup() {
      googlePopup.style.display = "block";
    }

    function loginAs(email) {
      localStorage.setItem("isLoggedIn", "true");
      showNotification(`Logged in as ${email}`);
      googlePopup.style.display = "none";
      setTimeout(() => {
        window.location.href = "FitVibe.html";
      }, 1500);
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.classList.toggle("fa-eye");
      togglePassword.classList.toggle("fa-eye-slash");
    });
  </script>
</body>
</html>
