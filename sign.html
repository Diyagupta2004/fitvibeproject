<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FitVibe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* BASE STYLES & BACKGROUND */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a0d1a 50%, #0d0d1a 100%);
            color: #f2e6ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background Gradients */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(218, 112, 214, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(192, 132, 252, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(167, 139, 250, 0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10%, 10%) rotate(120deg); }
            66% { transform: translate(-10%, 10%) rotate(240deg); }
        }

        /* Floating Shapes (Atmosphere) */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #DA70D6, #C084FC);
            border-radius: 50%;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 25s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #C084FC, #A78BFA);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            top: 60%;
            right: 10%;
            animation-delay: 5s;
            animation-duration: 30s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #A78BFA, #DA70D6);
            border-radius: 50%;
            bottom: 20%;
            left: 15%;
            animation-delay: 10s;
            animation-duration: 20s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(30px, -30px) rotate(90deg) scale(1.1); }
            50% { transform: translate(-20px, 20px) rotate(180deg) scale(0.9); }
            75% { transform: translate(20px, 30px) rotate(270deg) scale(1.05); }
        }

        /* LOGIN CARD STYLES (now Sign Up) */
        .login-container {
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(192, 132, 252, 0.2);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #DA70D6, #C084FC, #cc66ff, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            margin-bottom: 8px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% { filter: brightness(1) drop-shadow(0 0 10px rgba(192, 132, 252, 0.3)); }
            100% { filter: brightness(1.3) drop-shadow(0 0 20px rgba(192, 132, 252, 0.6)); }
        }

        .logo p {
            color: rgba(242, 230, 255, 0.6);
            font-size: 14px;
        }

        /* FORM STYLES */
        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: rgba(242, 230, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C084FC;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 10px;
            color: #f2e6ff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: rgba(26, 26, 26, 0.95);
            border-color: #C084FC;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(242, 230, 255, 0.4);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #C084FC;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
        }

        .password-toggle:hover {
            color: #DA70D6;
            transform: translateY(-50%) scale(1.1);
        }

        /* BUTTON STYLES */
        .btn-signup {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #C084FC, #DA70D6);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex; /* Added for centering loading spinner */
            justify-content: center; /* Added for centering loading spinner */
            align-items: center; /* Added for centering loading spinner */
        }

        .btn-signup:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(192, 132, 252, 0.6);
            background: linear-gradient(135deg, #DA70D6, #E0B0FF);
        }

        .btn-signup:active {
            transform: translateY(0);
        }

        .btn-signup:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 20px rgba(192, 132, 252, 0.2);
        }
        
        /* Message & Link Styles */
        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(192, 132, 252, 0.2);
        }

        .divider span {
            background: rgba(26, 26, 26, 0.9);
            padding: 0 15px;
            color: rgba(242, 230, 255, 0.5);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .login-link {
            text-align: center;
            color: rgba(242, 230, 255, 0.7);
            font-size: 14px;
        }

        .login-link a {
            color: #C084FC;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
        }

        .login-link a:hover {
            color: #DA70D6;
            text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
        }

        .error-message, .success-message {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease-in-out;
        }

        .error-message {
            background: rgba(255, 77, 77, 0.1);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #ff6b6b;
        }

        .success-message {
            background: rgba(77, 255, 136, 0.1);
            border: 1px solid rgba(77, 255, 136, 0.3);
            color: #4dff88;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: rgba(242, 230, 255, 0.6);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: #C084FC;
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="login-container">
        <div class="logo">
            <h1>FITVIBE</h1>
            <p>Create Your Fitness Account</p>
        </div>

        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span></span>
        </div>
        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i>
            <span></span>
        </div>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
                <div class="input-wrapper">
                    <i class="input-icon fas fa-user"></i>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Enter your full name"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                <div class="input-wrapper">
                    <i class="input-icon fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="input-wrapper">
                    <i class="input-icon fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Create a strong password (min 6 chars)"
                        required
                    >
                    <i class="password-toggle fas fa-eye" onclick="togglePassword()"></i>
                </div>
                <small id="passwordHelp" style="color: rgba(242, 230, 255, 0.5); font-size: 12px; margin-top: 5px; display: block;">Password must be at least 6 characters.</small>
            </div>

            <button type="submit" class="btn-signup" id="signupBtn">
                <i class="fas fa-user-plus"></i> Sign Up
            </button>
        </form>

        <div class="divider">
            <span>OR</span>
        </div>

        <div class="login-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>

        <div class="back-home">
            <a href="FitVibe.html">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        // Set the API URL. Ensure your backend server is running on this address.
        const API_URL = 'http://127.0.0.1:5000/api'; 
        const MIN_PASS_LENGTH = 6;

        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggle = document.querySelector('.password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggle.classList.remove('fa-eye');
                toggle.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggle.classList.remove('fa-eye-slash');
                toggle.classList.add('fa-eye');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            document.getElementById('successMessage').style.display = 'none';
            errorDiv.querySelector('span').textContent = message;
            errorDiv.style.display = 'flex';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            document.getElementById('errorMessage').style.display = 'none';
            successDiv.querySelector('span').textContent = message;
            successDiv.style.display = 'flex';
        }

        function setButtonState(isLoading) {
            const signupBtn = document.getElementById('signupBtn');
            if (isLoading) {
                signupBtn.disabled = true;
                // Using an inline spinner for better control over the button content
                signupBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing Up...';
            } else {
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<i class="fas fa-user-plus"></i> Sign Up';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Client-side validation
            if (password.length < MIN_PASS_LENGTH) {
                showError(`Password must be at least ${MIN_PASS_LENGTH} characters long.`);
                return;
            }

            setButtonState(true);

            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        name: fullName, 
                        email: email, 
                        password: password 
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccess('Sign Up successful! Redirecting to Log In...');
                    
                    // Delay the redirect to allow the user to see the success message
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);

                } else {
                    // Handles server-side validation errors (e.g., email already exists)
                    showError(data.message || 'Sign Up failed. Please check your details and try again.');
                    setButtonState(false);
                }
            } catch (error) {
                console.error('Sign Up error:', error);
                // This is the common error if the backend is not running or CORS is blocking
                showError('Could not connect to the server. Please ensure the backend is running.');
                setButtonState(false);
            }
        });
    </script>
</body>
</html>
