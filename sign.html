<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitVibe - Sign Up</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #121212;
      color: #e6e6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background-color: #1f1f1f;
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(177, 156, 217, 0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      margin-bottom: 30px;
      color: #b19cd9;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #2c2c2c;
      color: #e6e6fa;
      font-size: 14px;
      transition: border 0.3s ease;
    }

    input::placeholder {
      color: #999;
    }

    input:focus {
      outline: none;
      border-color: #b19cd9;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(to right, #b19cd9, #a188c8);
      color: #121212;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #a188c8, #b19cd9);
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #4CAF50;
      color: white;
      padding: 14px 24px;
      border-radius: 6px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      display: none;
      z-index: 1000;
    }

    .notification.error {
      background-color: #e74c3c;
    }

    .footer-text {
      margin-top: 20px;
      font-size: 14px;
      color: #999;
    }

    .footer-text a {
      color: #b19cd9;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Create Your FitVibe Account</h2>
    <form id="signupForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <div class="footer-text">
      Already have an account? <a href="login.html">Login here</a>
    </div>
  </div>

  <div class="notification" id="notification"></div>

  <script>
    const signupForm = document.getElementById('signupForm');
    const notification = document.getElementById('notification');

    function showToast(message, isError = false) {
      notification.textContent = message;
      notification.classList.toggle('error', isError);
      notification.style.display = 'block';
      setTimeout(() => {
        notification.style.display = 'none';
      }, 2500);
    }

    signupForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      // Basic validation
      if (!name || !email || !password) {
        showToast("Please fill all fields", true);
        return;
      }

      // Fetch existing users from localStorage
      let users = JSON.parse(localStorage.getItem('fitvibe_users')) || [];

      // Check if email exists
      const userExists = users.find(user => user.email === email);
      if (userExists) {
        showToast("Account already exists with this email!", true);
        return;
      }

      // Add new user
      users.push({ name, email, password });
      localStorage.setItem('fitvibe_users', JSON.stringify(users));

      showToast("Sign up successful!");

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>

</html>
