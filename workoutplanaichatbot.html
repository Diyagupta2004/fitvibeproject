<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FitVibe Chatbot</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      background: #1a1a1a;
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(204, 102, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #7a3cff;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      color: #fff;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 0.95rem;
    }

    .user {
      align-self: flex-end;
      background: #cc66ff;
      color: #fff;
    }

    .bot {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e0d6ff;
    }

    .chat-input {
      display: flex;
      padding: 14px;
      background: #111;
      border-top: 1px solid #333;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: #fff;
      font-size: 1rem;
    }

    input[type="text"]:focus {
      outline: none;
    }

    button {
      background: #7a3cff;
      color: white;
      border: none;
      padding: 10px 18px;
      margin-left: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #9e61ff;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">💬 FitVibe Bot</div>
    <div class="chat-messages" id="chat-box">
      <div class="msg bot">Hello. I am your fitness assistant. You may ask about diet, exercise, or recovery.</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your question..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("userInput");

    const formalReplies = {
      // DIET
      "diet": "A balanced diet includes proteins, carbohydrates, fats, vitamins, and minerals in appropriate amounts.",
      "protein": "Protein is essential for muscle repair and growth. Include sources like eggs, lentils, and lean meat.",
      "carbs": "Carbohydrates are the body’s primary energy source. Prefer complex carbs like oats and brown rice.",
      "sugar": "Excessive sugar intake should be avoided. Natural sugars from fruits are preferable.",
      "calories": "Caloric intake should match your physical activity level and health goals.",
      "junk food": "Junk food is generally high in calories and low in nutrients. It should be consumed minimally.",
      "cheat day": "Occasional indulgence is acceptable, but it should not disrupt overall discipline.",
      "breakfast": "Breakfast is important to start your metabolism and maintain energy throughout the day.",
      "fasting": "Fasting can be effective if done correctly. Stay hydrated and ensure nutrient intake during eating windows.",

      // WORKOUT
      "workout": "Regular exercise improves physical and mental health. Aim for at least 150 minutes per week.",
      "gym": "The gym provides structured environments for strength and cardio training.",
      "pushups": "Push-ups are a bodyweight exercise that strengthen the chest, arms, and core.",
      "burpees": "Burpees are a high-intensity exercise that improve endurance and overall fitness.",
      "cardio": "Cardio exercises improve cardiovascular health and help in weight management.",
      "legs": "Leg training is essential for overall strength and stability.",
      "abs": "Abdominal workouts strengthen core muscles but must be paired with proper diet for visible results.",
      "strength": "Strength training builds muscle, boosts metabolism, and improves bone health.",
      "planks": "Planks help build core endurance and stability.",

      // RECOVERY
      "rest": "Rest is necessary for muscle recovery and overall well-being.",
      "sleep": "7-9 hours of sleep is recommended for optimal recovery and performance.",
      "stretching": "Stretching improves flexibility and reduces injury risk.",
      "injury": "In case of injury, rest and consult a medical professional. Avoid stressing the affected area.",
      "hydration": "Staying hydrated supports digestion, circulation, and temperature regulation.",
      "overtraining": "Overtraining can lead to fatigue and injury. Schedule regular rest days.",
      "foam roll": "Foam rolling helps release muscle tension and improve mobility.",
      "recovery": "Recovery includes rest, hydration, nutrition, and light activity to aid healing.",

      // MINDSET
      "motivation": "Motivation may fluctuate, but consistency leads to progress.",
      "discipline": "Discipline ensures long-term success in health and fitness.",
      "lazy": "Lack of motivation is normal occasionally. Resume activity as soon as possible.",
      "goal": "Having a clear fitness goal provides direction and purpose to your routine.",
      "focus": "Stay focused on your routine to achieve better results.",
      "consistency": "Consistent effort is key to achieving and maintaining fitness.",
      "confidence": "Confidence improves with progress and self-awareness.",
      "routine": "A consistent routine builds habits and reduces decision fatigue.",

      // GENERAL GREETING
      "hi": "Hello. How can I assist you today?",
      "hello": "Greetings. Please type your question.",
      "chilli paratha": "That is a high-calorie food. Ensure it fits within your daily intake if consumed.",
      "paratha": "Parathas are energy-dense. Moderate consumption is recommended if you're managing weight."
    };

    function appendMessage(content, sender) {
      const msg = document.createElement("div");
      msg.className = `msg ${sender}`;
      msg.textContent = content;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function botReply(userText) {
      const text = userText.toLowerCase();
      let found = false;

      for (const keyword in formalReplies) {
        if (text.includes(keyword)) {
          found = true;
          setTimeout(() => {
            appendMessage(formalReplies[keyword], "bot");
          }, 600);
          break;
        }
      }

      if (!found) {
        setTimeout(() => {
          appendMessage("I'm not sure I understand that. Please rephrase or ask a related question.", "bot");
        }, 600);
      }
    }

    function sendMessage() {
      const text = input.value.trim();
      if (text === "") return;
      appendMessage(text, "user");
      input.value = "";
      botReply(text);
    }

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>








































































</body>
</html>
